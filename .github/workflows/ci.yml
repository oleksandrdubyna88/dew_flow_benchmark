name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The leftovers tests read the mounted conventions (the owner vectors, the `## Tokens` table, the janitor, the
      # sweeper classifier), and a missing file FAILS them — an uninitialised submodule is a broken setup, not a clean one.
      - run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # BEFORE the build: a formatting complaint is cheaper to read than a build log, and this
      # costs seconds. `--verify-no-changes` REPORTS and never rewrites — CI must not push a
      # reformat into somebody's branch, it must say the branch is not formatted and stop.
      - name: Formatted
        run: dotnet format dew_flow_benchmark.slnx --verify-no-changes --no-restore

      - name: Build
        run: dotnet build dew_flow_benchmark.slnx -c Release

      # xUnit v3 on Microsoft Testing Platform: the test project builds into a self-contained
      # runner executable. `dotnet test` has no VSTest host here and would abort — never use it.
      #
      # This step needs Docker (present on ubuntu-latest): the durability tests run against a real
      # Postgres via Testcontainers, because claim/settle/sweep are guarantees about concurrency and a
      # fake would only prove the fake agrees with what we assumed. They fail loudly rather than
      # skipping if Docker is absent — a durability suite that quietly does not run reports green
      # while guarding nothing.
      - name: Test
        run: ./tests/Bench.Tests/bin/Release/net10.0/Bench.Tests

      # The end-of-run audit has teeth. LeftoversSelfTest leaks a folder on purpose, and ONLY when
      # BENCH_LEFTOVERS_SELFTEST is set; this step sets it, AFTER the normal Test step, and is green only on a
      # NON-zero exit that carries the audit's first line (the counts and the case's own group word, no path) and the folder's
      # name on a per-folder line under that word, and on an empty, listable temp root. A listing error is red, never ignored. If xUnit did not
      # fail the run on an assembly-fixture cleanup exception this step would be red on its first run:
      # the audit must never become a warning silently.
      - name: The audit fails a run that leaves a claimed folder
        run: |
          set -o pipefail
          owner="u$(id -u)"
          for entry in "1:never disposed:selftest" "failed-dispose:disposed but not removed:selftest-failed"; do
            IFS=: read -r value words what <<< "$entry"
            if BENCH_LEFTOVERS_SELFTEST="$value" ./tests/Bench.Tests/bin/Release/net10.0/Bench.Tests --filter-class "*LeftoversSelfTest" 2>&1 | tee selftest.log; then
              echo "the end-of-run audit did not fail the run ($value)"; exit 1; fi
            # (a) the audit's FIRST line: the counts and the group summary, and no path on it ...
            first=$(grep -E "(^|[[:space:]]:[[:space:]])bench tests: this run left [0-9]+ folder\(s\) it claimed.*[0-9]+ $words" selftest.log | grep -v "testsToDelete-[uw][0-9]" || true)
            [ -n "$first" ] || { echo "the run failed, but not with the audit's first line (counts and '$words', no path) ($value)"; exit 1; }
            # (b) ... and the folder named on its own per-folder line, under the case's own group word.
            grep -Eq "^[[:space:]]+$words: .*/testsToDelete-[uw][0-9]{1,10}-bench-$what-[A-Za-z0-9]{6}" selftest.log \
              || { echo "the audit's message does not name the folder on a line of its own under '$words' ($value)"; exit 1; }
            left=$(find "${TMPDIR:-/tmp}" -maxdepth 1 -iname "teststodelete-${owner}-bench-$what-*") \
              || { echo "the temp root could not be listed"; exit 1; }
            [ -z "$left" ] || { echo "the audit left the folder behind: $left"; exit 1; }
          done

  # Both hosts over the wire, against a real Postgres: routing, the group prefixes, the refusals and
  # the shape of an EMPTY answer — which is the shape a fresh install actually serves and the one
  # nobody checks. It also asserts the boundary between the two hosts: the read API refuses the
  # ingest verb and has no read route on that path.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: suite
          POSTGRES_PASSWORD: suite
          POSTGRES_DB: bench
        ports: ['55432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BENCH_CONN: Host=127.0.0.1;Port=55432;Database=bench;Username=suite;Password=suite
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: git submodule update --init --depth 1 .agents/conventions

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - name: Install the pinned httpyac
        run: npm ci --prefix http

      # The API applies no migrations by design — the CLI owns the schema, and `prune` is the
      # cheapest verb that creates it.
      - name: Create the schema
        run: dotnet run --project hosts/Cli -c Release -- prune --db "$BENCH_CONN" --hit-retention-days 30

      # Built ONCE, before either host starts: two `dotnet run`s side by side both build the shared projects into one
      # bin/, and on 2026-09-28 one lost the race on Bench.Api.deps.json ("being used by another process") and the
      # collector never started — an environment failure that said nothing about the contract.
      - name: Build both hosts
        run: |
          dotnet build hosts/Api -c Release
          dotnet build hosts/Collector -c Release

      - name: Start both hosts and run the suite
        run: |
          ConnectionStrings__bench="$BENCH_CONN" ASPNETCORE_URLS=http://127.0.0.1:5411 \
            dotnet run --no-build --project hosts/Api -c Release &
          ConnectionStrings__bench="$BENCH_CONN" dotnet run --no-build --project hosts/Collector -c Release &
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:5411/api/bench/health && break
            sleep 2
          done
          node .agents/conventions/tools/http-run.mjs --env local --target http://127.0.0.1:5411

      - name: Every route has a request
        run: node .agents/conventions/tools/http-coverage.mjs --source src --source hosts

      - name: The post-deploy checklist is still well formed
        run: node .agents/conventions/tools/post-deploy-check.mjs

  # The plan lifecycle, enforced from the shared rules repository rather than four times over — the check
  # reads markdown, not code, so one implementation serves every consumer (see .agents/conventions/README.md).
  # Only that ONE submodule is fetched: `submodules: true` would drag every other one in for a markdown walk.
  # Node is preinstalled on the runner, so a Rust repository pays no toolchain for this.
  plans:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch the shared rules
        run: git submodule update --init --depth 1 .agents/conventions

      - name: Plan lifecycle
        run: node .agents/conventions/tools/plan-lifecycle.mjs
      # The protection `main` is supposed to have is a FILE now — `.github/branch-protection.json` —
      # because branch protection is the one part of a repository's CI that is not IN the repository.
      # Nothing makes GitHub read it; what it buys is that the intent is reviewed, and that the drift
      # from it is something a command prints rather than something nobody finds.
      #
      # This step is the half that needs no token: the comparison logic, against fixtures. It caught
      # three real bugs in that logic the first time it ran. Comparing to the REAL branch needs
      # repository admin, so `node .github/scripts/branch-protection.mjs` is run by hand.
      - name: Branch protection selftest
        run: node .github/scripts/branch-protection.mjs --selftest

      # Every submodule pin must equal its remote's tip — "a rule change and the pin bumps are one
      # task" is a check now, not a habit (see .agents/conventions/README.md, Editing discipline).
      - name: Pin check
        run: node .agents/conventions/tools/pin-check.mjs

      # The Claude host adapter is present, wired and byte-identical to the family's reference: a session
      # whose SessionStart hook is missing starts without this repository's rules (story 3.B of the
      # conventions plan installed it, 2026-11-11).
      - name: Adapter check
        run: node .agents/conventions/tools/adapter-check.mjs

      # The review-gate block is a shared rule; a copy of it in this repository is the drift the
      # rule exists to prevent. The panel can only see a repo somebody opened in VS Code.
      - name: Gate snippet
        run: node .agents/conventions/tools/gate-snippet-check.mjs

      # The root Directory.Build.rsp is really there and really says -nr:false. Measured on this
      # family's machine: five sessions building at once held 72 MSBuild workers and 10.7 GB,
      # because a worker busy in one build cannot be reused by another
      # (see .agents/conventions/csharp/dotnet-build.md). A repository with no C# passes without an opinion.
      - name: Build flags
        run: node .agents/conventions/tools/build-flags-check.mjs


  # ---------------------------------------------------------------------------
  # The workflows themselves are code, and nothing checked them until now.
  #
  # actionlint reads every file under .github/workflows. The rule that earns its place on its own
  # is the script-injection one: a `${{ }}` expression written inline in a `run:` is pasted into
  # the shell source before bash parses it, and this family has already had to fix that by hand.
  # Separately, because ubuntu runners ship shellcheck, it lints the `run:` blocks as shell.
  #
  # NO NEW ACTION. actionlint publishes none — only a release binary — and every `uses:` line here
  # was just pinned to a commit SHA so the supply chain stays auditable. Pulling in an unpinnable
  # third-party action to get a linter would undo that. The binary is pinned by VERSION and verified
  # by CHECKSUM, which is the same promise a SHA pin makes: what runs is what was reviewed.
  #
  # Measured when this was added: zero in this repository and eighteen across the family, every one of them in a
  # release or deploy workflow, and all eighteen fixed before this job was allowed to fail on them.
  #
  # THE FIRST MEASUREMENT SAID ZERO EVERYWHERE AND WAS WRONG, which is why the step below asserts
  # shellcheck is present before linting. Without it actionlint keeps its OWN rules — the injection
  # check included — and silently drops the shell analysis of every `run:` block. No warning, exit
  # zero, a green check, and eighteen findings left standing.
  workflows:
    name: workflows · actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lint every workflow
        env:
          ACTIONLINT_VERSION: '1.7.12'
          ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
        run: |
          set -euo pipefail
          # The dependency this gate is quietly useless without — see the note above the job.
          command -v shellcheck > /dev/null || {
            echo "shellcheck is not on PATH: actionlint would skip every run: block and pass"
            exit 1
          }
          # Retried, because one HTTP 500 from the release host failed an unrelated Dependabot
          # pull request — measured on dew_flow_mcp #23. `--retry-all-errors` is the part that
          # matters: curl retries transport failures on its own, but treats a 500 as a final
          # answer. The checksum below still decides what runs, so this widens the window without
          # widening what is trusted.
          #
          # AND THE WINDOW WAS TWO ORDERS OF MAGNITUDE TOO SHORT, measured on
          # dew_flow_connect_other_ais 2026-09-21: four consecutive 504s between 14:53:19.86 and
          # 14:53:25.89 - 6.08 seconds for the whole budget, because `--retry-delay 2` REPLACES
          # curl's exponential backoff with a flat two seconds. A 504 from a CDN is a server-side
          # outage measured in minutes. The guard was built for exactly this and then given six
          # seconds to do it in, so it failed looking like it worked. Dropping the fixed delay
          # restores the backoff (1, 2, 4, 8, 16 s); `--retry-max-time` is the ceiling.
          curl -fsSL --proto '=https' --tlsv1.2 --retry 5 --retry-max-time 120 --retry-all-errors \
            -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v$ACTIONLINT_VERSION/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "$ACTIONLINT_SHA256  actionlint.tar.gz" | sha256sum -c -
          tar -xzf actionlint.tar.gz actionlint
          ./actionlint -color
